config_version = 2

[audio]
enable_overdrive = true

[bar.main]
background_opacity = 0.99999997764825821
capsule_opacity = 0.99999997764825821
center = [ "workspaces" ]
color = "secondary"
end = [ "tray", "keyboard_layout", "group:g4", "group:g1", "notifications", "group:g5" ]
font_family = "Noto Sans"
icon_color = "primary"
margin_edge = 0
margin_ends = 1
panel_overlap = 0
radius_top_left = 0
radius_top_right = 0
start = [ "launcher", "group:g3", "group:g2", "media" ]

    [[bar.main.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "network", "bluetooth" ]
    opacity = 0.89999997615814209
    padding = 6.0

    [[bar.main.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "sysmon", "ram", "temp", "network_rx", "network_tx" ]
    opacity = 1.0
    padding = 6.0

    [[bar.main.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "clock", "date" ]
    opacity = 1.0
    padding = 6.0

    [[bar.main.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "volume", "input_volume" ]
    opacity = 1.0
    padding = 6.0

    [[bar.main.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g5"
    members = [ "control-center" ]
    opacity = 1.0
    padding = 6.0

[dock]
background_opacity = 0.99999997764825821
enabled = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-3",
    "lockscreen-login-box@DP-2",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 70.0
    box_width = 400.0
    cx = 1164.0
    cy = 1190.0
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 320.0
    box_width = 768.0
    cx = 1163.5
    cy = 302.5
    output = "DP-3"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = true
        background_padding = 9
        background_radius = 15
        center_text = false
        clock_style = "digital"
        color = "primary"
        format = "{:%H:%M:%S}"
        shadow = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 192.0
    box_width = 640.0
    cx = 1163.5
    cy = 1006.5
    output = "DP-3"
    rotation = 0.0
    type = "sysmon"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        stat = "cpu_usage"
        stat2 = "cpu_temp"

[shell]
show_location = false
ui_scale = 1.0000000074505806

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "attached"

[system.monitor]
gpu_poll_seconds = 5

[theme]
builtin = "Ayu"
community_palette = "Kanagawa Kasumi"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/benq/Pictures/Wallpapers/wink.png"

    [wallpaper.last]
    path = "/home/benq/Pictures/Wallpapers/wink.png"

    [wallpaper.monitors.DP-2]
    path = "/home/benq/Pictures/Wallpapers/wink.png"

    [wallpaper.monitors.DP-3]
    path = "/home/benq/Pictures/Wallpapers/wink.png"

[widget.clock]
color = "secondary"
format = "{:%H:%M:%S}"

[widget.date]
color = "primary"

[widget.media]
title_scroll = "always"

[widget.sysmon]
enabled = true

[widget.temp]
stat = "gpu_temp"

[widget.workspaces]
enabled = true
labels_only_when_occupied = true