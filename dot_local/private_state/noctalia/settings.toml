config_version = 13

[accessibility]
ui_scale = 1.0

[audio]
enable_overdrive = true

[bar.main]
background_opacity = 0.99999997764825821
capsule_opacity = 0.99999997764825821
center = [ "workspaces" ]
color = "secondary"
end = [ "tray", "keyboard_layout", "group:g4", "group:g1", "notifications", "group:g5" ]
font_family = "Noto Sans"
icon_color = "primary"
margin_edge = 0
margin_ends = 1
panel_overlap = 0
radius_top_left = 0
radius_top_right = 0
start = [ "launcher", "group:g3", "group:g2", "ram", "group:g7", "group:g6", "sysmon_disk" ]

    [[bar.main.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "network", "bluetooth" ]
    opacity = 0.89999997615814209
    padding = 6.0

    [[bar.main.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "clock", "date" ]
    opacity = 1.0
    padding = 6.0

    [[bar.main.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "privacy", "volume", "input_volume" ]
    opacity = 1.0
    padding = 6.0

    [[bar.main.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g5"
    members = [ "control-center" ]
    opacity = 1.0
    padding = 6.0

    [[bar.main.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "sysmon_cpu", "sysmon_cpu_temp" ]
    opacity = 1.0
    padding = 6.0

    [[bar.main.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g6"
    members = [ "network_rx", "network_tx" ]
    opacity = 1.0
    padding = 6.0

    [[bar.main.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g7"
    members = [ "sysmon_gpu", "sysmon_gpu_temp" ]
    opacity = 1.0
    padding = 6.0

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

[dock]
background_opacity = 0.99999997764825821
enabled = false

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 660.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 3600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600.0

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-3",
    "lockscreen-login-box@DP-2",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 961.0
    output = "DP-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = false
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 720.0
    cx = 1163.5
    cy = 1120.5
    output = "DP-3"
    placement_height = 1309.0
    placement_width = 2327.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = false
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 176.0
    box_width = 704.0
    cx = 1163.5
    cy = 854.5
    output = "DP-3"
    placement_height = 1309.0
    placement_width = 2327.0
    rotation = 0.0
    type = "sysmon"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        stat = "cpu_usage"
        stat2 = "cpu_temp"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 304.0
    box_width = 688.0
    cx = 1155.5
    cy = 334.5
    output = "DP-3"
    placement_height = 1309.0
    placement_width = 2327.0
    rotation = 0.0
    type = "clock"

[notification]
filter_order = [ "filter" ]

    [notification.filter.filter]
    allow_permanent = false
    enabled = true
    match = "satty"
    override_duration = 500
    play_sound = true
    save_history = false
    show_toast = true

[osd.kinds]
media = false

[shell]
show_location = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "attached"

[system.monitor]
gpu_poll_seconds = 5

[theme]
builtin = "Ayu"
community_palette = "Kanagawa Kasumi"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/benq/Pictures/Wallpapers/wink.png"

    [wallpaper.last]
    path = "/home/benq/Pictures/Wallpapers/wink.png"

    [wallpaper.monitors.DP-2]
    path = "/home/benq/Pictures/Wallpapers/wink.png"

    [wallpaper.monitors.DP-3]
    path = "/home/benq/Pictures/Wallpapers/wink.png"

[widget.clock]
color = "secondary"
format = "{:%H:%M:%S}"

[widget.date]
color = "primary"

[widget.media]
enabled = false

[widget.network]
show_vpn_label = true

[widget.sysmon]
enabled = true

[widget.sysmon_cpu]
type = "sysmon"

[widget.sysmon_cpu_temp]
stat = "cpu_temp"
type = "sysmon"

[widget.sysmon_disk]
stat = "disk_free"
type = "sysmon"

[widget.sysmon_gpu]
glyph = "gpu-usage"
stat = "gpu_vram"
type = "sysmon"

[widget.sysmon_gpu_temp]
stat = "gpu_temp"
type = "sysmon"

[widget.workspaces]
enabled = true
labels_only_when_occupied = true
