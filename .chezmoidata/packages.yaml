packages:
  arch:
    - 7zip
    - age
    - base-devel
    - bat
    - bitwarden-cli
    - breeze-gtk
    - btop
    - cmus
    - curl
    - dotnet-sdk
    - eza
    - fd
    - ffmpeg 
    - fzf
    - git
    - grim
    - imagemagick
    - jq
    - kvantum
    - kvantum-qt5
    - lazygit
    - npm
    - openssh
    - poppler
    - python-pip
    - qt5ct
    - qt6ct
    - resvg
    - ripgrep
    - rofi
    - satty
    - slurp
    - tmux
    - unzip
    - wget
    - wtype
    - xdg-terminal-exec
    - yazi 
    - zoxide
    - zsh
  aur:
    - nil-git
    - nixfmt
    - prizrak-box-bin
    - python-xmlformatter
    - still
    - tree-sitter-cli-github-bin
  go:
    - id: github.com/davidbudnick/redis-tui
      version: v1.0.41

  flatpak_remotes:
    - name: flathub
      url: https://dl.flathub.org/repo/flathub.flatpakrepo
    - name: flathub-beta
      url: https://dl.flathub.org/beta-repo/flathub-beta.flatpakrepo

  x-fp-stable: &fp_stable
    remote: flathub
    branch: stable
  x-fp-beta: &fp_beta
    remote: flathub-beta
    branch: beta

  flatpak:
    - <<: *fp_stable
      id: com.github.tchx84.Flatseal
    - <<: *fp_stable
      id: com.usebottles.bottles
    - <<: *fp_beta
      id: com.discordapp.DiscordCanary
